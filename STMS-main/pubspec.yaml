name: autocare_app
description: AutoCare - Automotive Service & E-Commerce + Smart Traffic Management + GrPr Complete Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'  # Using highest minimum (from autocare) for best compatibility

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # UI & DESIGN LIBRARIES (Merged from all 3 projects)
  # ============================================================
  cupertino_icons: ^1.0.8           # Common
  lucide_icons: ^0.257.0            # From gr_pr
  font_awesome_flutter: ^10.7.0     # From smart_traffic
  dotted_border: ^2.1.0             # From smart_traffic
  
  # ============================================================
  # STATE MANAGEMENT (Using highest version)
  # ============================================================
  flutter_riverpod: ^2.5.1          # From autocare (primary)
  
  # ============================================================
  # MAPS & LOCATION (Merged - flutter_map for flexibility + google_maps)
  # ============================================================
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  http: ^1.2.1
             
  # ============================================================
  # PAYMENT & STRIPE
  # ============================================================
  flutter_stripe: ^10.2.0           # From autocare
  
  # ============================================================
  # UTILITIES & HELPERS
  # ============================================================
  intl: ^0.20.2                     # Using highest (from gr_pr)
  url_launcher: ^6.3.1              # From gr_pr
  image_picker: ^1.1.2              # From gr_pr
  intl_phone_field: ^3.2.0          # From smart_traffic
  
  # ============================================================
  # FIREBASE (Will add if needed - not present in original files)
  # ============================================================
  # Uncomment when Firebase is added:
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # firebase_storage: ^11.6.0
  # firebase_messaging: ^14.7.0
  # firebase_crashlytics: ^3.4.9
  # firebase_analytics: ^10.8.0

  # ============================================================
  # STORAGE (For future use)
  # ============================================================
  shared_preferences: ^2.2.2
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0

  # ============================================================
  # ADDITIONAL UTILITIES (From smart_traffic)
  # ============================================================
  path_provider: ^2.1.1              # For file handling
  permission_handler: ^11.0.1       # For permissions
  camera: ^0.11.0+2                  # For live camera feed
  flutter_svg: ^2.0.9               # SVG support
  cached_network_image: ^3.3.0      # Image caching
  flutter_rating_bar: ^4.0.1        # Rating widgets
  shimmer: ^3.0.0                   # Loading effects
  google_sign_in: ^6.2.1            # Google OAuth Sign-In

  # ============================================================
  # LOCAL NOTIFICATIONS (From gr_pr)
  # ============================================================
  # flutter_local_notifications: ^16.3.0

  # ============================================================
  # DIO (Better HTTP client - optional but recommended)
  # ============================================================
  dio: ^5.4.0
  signalr_netcore: ^1.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0              # Using higher version (from autocare)
  flutter_launcher_icons: ^0.13.1    # From smart_traffic
  # build_runner: ^2.4.8             # For Riverpod code generation (uncomment if needed)
  # riverpod_generator: ^2.3.0       # For Riverpod code generation

# ============================================================
# FLUTTER CONFIGURATION
# ============================================================
flutter:
  uses-material-design: true

  # ============================================================
  # ASSETS (Merged from all 3 projects)
  # ============================================================
  assets:
    # From autocare
    - assets/images/
    - assets/fonts/
    
    # From gr_pr
    # (already covered by assets/images/)
    
    # From smart_traffic
    # - assets/map_styles/          # Add if you have map styles
    # - assets/grpr/                # For GrPr specific assets
    # - assets/icons/               # For custom icons
    - assets/icon/                # For app icons and logo

  # ============================================================
  # FONTS (Merged - Outfit from gr_pr, SpaceGrotesk optional)
  # ============================================================
  # fonts:
  #   # From gr_pr - Outfit font family (complete weight range)
  #   - family: Outfit
  #     fonts:
  #       - asset: assets/fonts/Outfit-Thin.ttf
  #         weight: 100
  #       - asset: assets/fonts/Outfit-ExtraLight.ttf
  #         weight: 200
  #       - asset: assets/fonts/Outfit-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/Outfit-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Outfit-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Outfit-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Outfit-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Outfit-ExtraBold.ttf
  #         weight: 800
  #       - asset: assets/fonts/Outfit-Black.ttf
  #         weight: 900
    
    # Optional: SpaceGrotesk from autocare (uncomment if you have the font files)
    # - family: SpaceGrotesk
    #   fonts:
    #     - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    #       weight: 400
    #     - asset: assets/fonts/SpaceGrotesk-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/SpaceGrotesk-Bold.ttf
    #       weight: 700

# ============================================================
# LAUNCHER ICON CONFIGURATION (From smart_traffic)
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/smart.png"
  adaptive_icon_background: "#080808"    # Matches your dark theme
  adaptive_icon_foreground: "assets/icon/smart.png"