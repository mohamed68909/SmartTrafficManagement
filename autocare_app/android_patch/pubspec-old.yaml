name: autocare_app
description: AutoCare - Automotive Service & E-Commerce App (Graduation Project)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Stripe Payment
  flutter_stripe: ^11.1.0

  # HTTP for Stripe PaymentIntent (move to backend in production!)
  http: ^1.2.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Uncomment after placing SpaceGrotesk TTF files in assets/fonts/:
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/SpaceGrotesk-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700
  assets:
    - assets/images/
    - assets/fonts/
